dependencies: # dependencies will be built and put to local repo
  - cpptrace
  - breakpad

packages: # packages will be built and installed
  - name: quickshell-git
    auto-update:
      from: "pkgbuild"
      url: "https://raw.githubusercontent.com/end-4/dots-hyprland/main/sdata/dist-arch/illogical-impulse-quickshell-git/PKGBUILD"

  - name: matugen
    auto-update:
      from: "release"
      repo: "InioX/matugen" # for github api

  - name: kitty
    auto-update:
      from: "release"
      repo: "kovidgoyal/kitty"
